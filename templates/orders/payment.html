{% extends "layouts/site.html" %}

{% block title %}
    Secure Payment | Mint Grow Farm
{% endblock %}

{% block content %}

<section class="section cart-section">
    <div class="container">
        <div class="empty-cart" style="max-width: 600px; margin: 0 auto;">
            
            <div class="payment-spinner-wrap">
                <div class="payment-spinner"></div>
                <div class="payment-spinner-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <div class="payment-security-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                256-Bit Secure SSL Payment
            </div>

            <h3 style="margin-bottom: 10px;">Opening Payment Gateway...</h3>
            
            <p>
                Please complete your transaction in the secure Razorpay popup window.<br>
                <strong>Do not refresh or close this page.</strong>
            </p>

            <div class="payment-fallback-actions">
                <button type="button" id="rzp-reopen-btn" class="payment-retry-link">
                    Didn't open? Click here to launch payment window
                </button>
                <button type="button" id="cancel-payment-btn" class="payment-cancel-btn">
                    Cancel and return to checkout
                </button>
            </div>

        </div>
    </div>
</section>

<!-- Configuration Element for Pure JS separation -->
<div id="payment-config"
     data-key="{{ razorpay_key_id }}"
     data-amount="{{ amount }}"
     data-currency="{{ currency }}"
     data-name="Mint Grow Farm"
     data-description="Order #{{ order.order_number }}"
     data-order-id="{{ razorpay_order_id }}"
     data-prefill-name="{{ order.name }}"
     data-prefill-email="{{ order.email }}"
     data-prefill-contact="{{ order.phone }}"
     data-csrf="{{ csrf_token }}"
     data-success-url="{% url 'razorpay_payment_success' %}"
     data-cancel-url="{% url 'razorpay_payment_cancel' %}"
     data-order-number="{{ order.order_number }}"
     style="display: none;">
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    const configEl = document.getElementById("payment-config");
    const config = configEl ? configEl.dataset : {};

    function submitPaymentCancel() {
        const form = document.createElement("form");
        form.method = "POST";
        form.action = config.cancelUrl;

        const csrfToken = document.createElement("input");
        csrfToken.type = "hidden";
        csrfToken.name = "csrfmiddlewaretoken";
        csrfToken.value = config.csrf;
        form.appendChild(csrfToken);

        const orderNumber = document.createElement("input");
        orderNumber.type = "hidden";
        orderNumber.name = "order_number";
        orderNumber.value = config.orderNumber;
        form.appendChild(orderNumber);

        document.body.appendChild(form);
        form.submit();
    }

    const options = {
        key: config.key,
        amount: parseInt(config.amount, 10),
        currency: config.currency,
        name: config.name,
        description: config.description,
        order_id: config.orderId,

        handler: function (response) {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = config.successUrl;

            const csrfToken = document.createElement("input");
            csrfToken.type = "hidden";
            csrfToken.name = "csrfmiddlewaretoken";
            csrfToken.value = config.csrf;
            form.appendChild(csrfToken);

            const paymentId = document.createElement("input");
            paymentId.type = "hidden";
            paymentId.name = "razorpay_payment_id";
            paymentId.value = response.razorpay_payment_id;
            form.appendChild(paymentId);

            const orderId = document.createElement("input");
            orderId.type = "hidden";
            orderId.name = "razorpay_order_id";
            orderId.value = response.razorpay_order_id;
            form.appendChild(orderId);

            const signature = document.createElement("input");
            signature.type = "hidden";
            signature.name = "razorpay_signature";
            signature.value = response.razorpay_signature;
            form.appendChild(signature);

            document.body.appendChild(form);
            form.submit();
        },

        modal: {
            ondismiss: function () {
                console.log("Payment checkout modal dismissed by user. Cancelling order.");
                submitPaymentCancel();
            }
        },

        prefill: {
            name: config.prefillName,
            email: config.prefillEmail,
            contact: config.prefillContact
        },

        theme: {
            color: "#65a832"
        }
    };

    const razorpay = new Razorpay(options);

    razorpay.on("payment.failed", function (response) {
        console.error("Razorpay Payment Error:", response.error);
    });

    const reopenBtn = document.getElementById("rzp-reopen-btn");
    if (reopenBtn) {
        reopenBtn.addEventListener("click", function (e) {
            e.preventDefault();
            razorpay.open();
        });
    }

    const cancelBtn = document.getElementById("cancel-payment-btn");
    if (cancelBtn) {
        cancelBtn.addEventListener("click", function (e) {
            e.preventDefault();
            submitPaymentCancel();
        });
    }

    window.addEventListener("DOMContentLoaded", function () {
        razorpay.open();
    });
</script>

{% endblock %}
