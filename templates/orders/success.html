{% extends "layouts/site.html" %}

{% block title %}
Order Successful | Mint Grow Farm
{% endblock %}

{% block content %}

<section class="section">
    <div class="container">

        <div class="order-success">

            <div class="order-success-icon">
                ✓
            </div>

            <h1>
                Order Placed Successfully
            </h1>

            <p>
                Thank you for your order.
            </p>

            <div class="order-number">
                Order Number

                <strong>
                    {{ order_number }}
                </strong>
            </div>

            <a
                href="{% url 'public_product_list' %}"
                class="btn btn-primary"
            >
                Continue Shopping
            </a>

        </div>

    </div>
</section>

{% endblock %}
