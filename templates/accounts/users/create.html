{% extends "layouts/app.html" %}

{% block title %}Add User | Mint Grow{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="container-xl">
        <div class="row g-2 align-items-center">

            <div class="col">
                <div class="page-pretitle">
                    User Management
                </div>

                <h2 class="page-title">
                    Add User
                </h2>
            </div>

            <div class="col-auto ms-auto">
                <a
                    href="{% url 'user_list' %}"
                    class="btn btn-outline-secondary"
                >
                    Back
                </a>
            </div>

        </div>
    </div>
</div>

<div class="page-body">
    <div class="container-xl">

        <div class="card">
            <form
                method="post"
                enctype="multipart/form-data"
                novalidate
            >
                <div class="card-header">
                    <h3 class="card-title">
                        User Information
                    </h3>
                </div>

                <div class="card-body">
                    {% include "accounts/users/form.html" %}
                </div>

                <div class="card-footer text-end">
                    <a
                        href="{% url 'user_list' %}"
                        class="btn btn-link"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save User
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
