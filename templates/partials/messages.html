{% if messages %}
    <div class="mb-3">
        {% for message in messages %}

            <div
                class="
                    alert
                    alert-{{ message.tags|default:'info' }}
                    alert-dismissible
                "
                role="alert"
            >
                <div>
                    {{ message }}
                </div>

                <a
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="close"
                ></a>
            </div>

        {% endfor %}
    </div>
{% endif %}
