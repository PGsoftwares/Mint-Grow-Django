<header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar-menu"
            aria-controls="navbar-menu"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-nav flex-row order-md-last ms-auto">

            <div class="nav-item">
                <button
                    type="button"
                    id="themeToggle"
                    class="nav-link px-0 btn btn-link"
                    aria-label="Toggle dark and light mode"
                    title="Toggle theme"
                >
                    <span id="lightModeIcon">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="icon"
                        >
                            <path d="M12 3v1"></path>
                            <path d="M12 20v1"></path>
                            <path d="M3 12h1"></path>
                            <path d="M20 12h1"></path>
                            <path d="M5.6 5.6l.7 .7"></path>
                            <path d="M17.7 17.7l.7 .7"></path>
                            <path d="M5.6 18.4l.7 -.7"></path>
                            <path d="M17.7 6.3l.7 -.7"></path>
                            <circle cx="12" cy="12" r="4"></circle>
                        </svg>
                    </span>

                    <span id="darkModeIcon" class="d-none">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="icon"
                        >
                            <path d="M12 3c.132 0 .263 .003 .393 .01a7.5 7.5 0 0 0 8.597 8.597a9 9 0 1 1 -8.99 -8.607z"></path>
                        </svg>
                    </span>
                </button>
            </div>


            <div class="nav-item dropdown">

                <a
                    href="#"
                    class="nav-link d-flex lh-1 text-reset p-0"
                    data-bs-toggle="dropdown"
                    aria-label="Open user menu"
                >

                    {% if request.user.profile_photo %}
                        <span
                            class="avatar avatar-sm"
                            style="
                                background-image:
                                url('{{ request.user.profile_photo.url }}');
                            "
                        ></span>
                    {% else %}
                        <span class="avatar avatar-sm bg-primary-lt">
                            {{ request.user.name|slice:":1"|upper }}
                        </span>
                    {% endif %}

                    <div class="d-none d-xl-block ps-2">

                        <div>
                            {{ request.user.name }}
                        </div>

                        <div class="mt-1 small text-secondary">
                            {{ request.user.email }}
                        </div>

                    </div>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">

                    <a
                        href="{% url 'home' %}"
                        class="dropdown-item"
                    >
                        Website
                    </a>

                    <div class="dropdown-divider"></div>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="dropdown-item"
                        >
                            Logout
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</header>
